[package]
name = "duet"
version = "0.1.1"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Explicit, local, bidirectional folder synchronization for GNOME"
repository = "https://github.com/rtomasa/duet"

[features]
default = []
gui = ["dep:gtk", "dep:adw", "dep:glib", "dep:gio"]

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
filetime = "0.2"
fs2 = "0.4"
hex = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.12"
thiserror = "2.0"
uuid = { version = "1.11", features = ["v7", "serde"] }
walkdir = "2.5"

gtk = { package = "gtk4", version = "0.9", features = ["v4_10"], optional = true }
adw = { package = "libadwaita", version = "0.7", features = ["v1_5"], optional = true }
glib = { version = "0.20", optional = true }
gio = { version = "0.20", optional = true }

[dev-dependencies]
tempfile = "3.12"

[[bin]]
name = "duet"
path = "src/main.rs"

[profile.release]
lto = "thin"
strip = "symbols"
